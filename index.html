<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>旅行社 SOP · 司机 & 行政</title>

    <link rel="icon" href="logo.jpg" type="image/jpeg" />
    <link rel="shortcut icon" href="logo.jpg" type="image/jpeg" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="sop-container">
    <div class="sop-header">
        <div class="sop-header-left">
            <img src="logo.jpg" alt="公司Logo" class="logo-img" />
            <h1>
                🚐 旅行社 SOP
                <small>司机 · 行政</small>
            </h1>
        </div>
        <span class="badge-count" id="totalCount">0 项</span>
    </div>

    <div class="sop-intro">
        <span>📌</span> 员工 SOP 参考手册 · 点击折叠板块展开/收起
        <span style="margin-left:auto; opacity:0.4;">版本 1.0</span>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" data-tab="driver" id="tabDriver">
            🧑‍✈️ 司机 SOP
            <span class="tab-count" id="driverCount">0</span>
        </button>
        <button class="tab-btn" data-tab="admin" id="tabAdmin">
            📋 行政 SOP
            <span class="tab-count" id="adminCount">0</span>
        </button>
        <button class="tab-btn" data-tab="recruit" id="tabRecruit">
            📢 招聘广告
        </button>
    </div>

    <div id="driverTab" class="tab-content">
        <ul class="task-list" id="driverList"></ul>
    </div>

    <div id="adminTab" class="tab-content hidden">
        <ul class="task-list" id="adminList"></ul>
    </div>

    <div id="recruitTab" class="tab-content hidden">
        <!-- 招聘广告内容由 JS 动态生成，或直接写在这里也可以 -->
        <div id="recruitContainer"></div>
    </div>

    <div class="footer-actions">
        <div class="info" id="progressInfo">📊 共 0 条规则</div>
    </div>
</div>

<!-- ===== 图片放大模态框 ===== -->
<div class="modal-overlay" id="imageModal">
    <img id="modalImage" src="" alt="放大查看" />
</div>

<!-- ===== 脚本引用 ===== -->
<script src="data-driver.js"></script>
<script src="data-admin.js"></script>
<script src="data-recruit.js"></script>
<script src="app.js"></script>

</body>
</html>
